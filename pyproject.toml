[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "particletracker"
version = "1.0.0"
description = "Advanced particle detection and tracking for fluorescence microscopy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ParticleTracker Development Team"},
]
keywords = ["microscopy", "particle-tracking", "fluorescence", "STORM", "PALM", "TIRF", "super-resolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-image>=0.19.0",
    "matplotlib>=3.4.0",
    "tifffile>=2021.7.2",
    "tqdm>=4.62.0",
    "h5py>=3.1.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.2",
]
gui = [
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.12.0",
]
deep = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
]

[project.scripts]
particletracker = "gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py38"]
